# Bygger appen og kjører testene hver gang du pusher til GitHub.
# Den ferdige APK-en legges ut som en "release" under Releases på GitHub, klar til å lastes ned på telefonen.
name: Bygg

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hele historikken: versjonsnummeret er antall commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Enhetstester og APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      # Egen Python: systempythonen på ubuntu-24.04 nekter "pip install" (PEP 668).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sjekk figurene
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/figurer/sjekk.py

      - name: Gi APK-en et navn med byggenummeret
        run: cp app/build/outputs/apk/debug/app-debug.apk rigg-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rigg-apk
          path: rigg-${{ github.run_number }}.apk
          retention-days: 3

      - name: Testrapport ved feil
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testrapport
          path: app/build/reports/tests/
          retention-days: 7

      - name: Legg ut som release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rigg bygg ${{ github.run_number }}
          prerelease: true
          files: rigg-${{ github.run_number }}.apk
